name: Industrial Test Framework CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'testing-framework/**'
  pull_request:
    branches: [main]
    paths:
      - 'testing-framework/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Unit & Integration Tests ──────────────────────────────────────────
  test:
    name: Tests (Rust ${{ matrix.rust }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, "1.75"]
    defaults:
      run:
        working-directory: testing-framework
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            testing-framework/target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('testing-framework/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Run tests (release)
        run: cargo test --workspace --release

  # ── Property-Based Tests (sharded) ────────────────────────────────────
  property-tests:
    name: Property Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: testing-framework
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            testing-framework/target
          key: ${{ runner.os }}-cargo-prop-${{ hashFiles('testing-framework/Cargo.lock') }}

      - name: Build CLI
        run: cargo build --release -p industrial-test-cli

      - name: Run property tests (shard ${{ matrix.shard }})
        run: |
          ./target/release/industrial-test property \
            --cases 250 \
            --seed ${{ matrix.shard }}00 \
            --max-nodes 30 \
            --max-edges 60 \
            -o ./test-output

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-results-shard-${{ matrix.shard }}
          path: testing-framework/test-output/
          retention-days: 14

  # ── Stress Tests ──────────────────────────────────────────────────────
  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testing-framework
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            testing-framework/target
          key: ${{ runner.os }}-cargo-stress-${{ hashFiles('testing-framework/Cargo.lock') }}

      - name: Build CLI
        run: cargo build --release -p industrial-test-cli

      - name: Stress test (1K nodes)
        run: ./target/release/industrial-test stress --nodes 1000 --edges 3000 --timeout 60

      - name: Stress test (10K nodes)
        run: ./target/release/industrial-test stress --nodes 10000 --edges 30000 --timeout 120

      - name: Stress test (50K nodes)
        run: ./target/release/industrial-test stress --nodes 50000 --edges 100000 --timeout 300

  # ── Benchmarks ────────────────────────────────────────────────────────
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testing-framework
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            testing-framework/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('testing-framework/Cargo.lock') }}

      - name: Run criterion benchmarks
        run: cargo bench --bench model_bench -- --output-format bencher 2>&1 | tee benchmark-results.txt

      - name: Run CLI benchmarks
        run: |
          cargo build --release -p industrial-test-cli
          ./target/release/industrial-test bench --iterations 200 --csv -o ./test-output

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            testing-framework/benchmark-results.txt
            testing-framework/test-output/benchmarks.csv
          retention-days: 30

  # ── CRDT Simulation ───────────────────────────────────────────────────
  crdt-tests:
    name: CRDT Convergence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testing-framework
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            testing-framework/target
          key: ${{ runner.os }}-cargo-crdt-${{ hashFiles('testing-framework/Cargo.lock') }}

      - name: Build CLI
        run: cargo build --release -p industrial-test-cli

      - name: CRDT test (no partitions)
        run: ./target/release/industrial-test crdt --clients 5 --ops 50

      - name: CRDT test (with partitions)
        run: ./target/release/industrial-test crdt --clients 5 --ops 50 --partitions

  # ── Python Orchestrator Tests ─────────────────────────────────────────
  python-tests:
    name: Python Orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testing-framework/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # ── Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testing-framework
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
